name: elivre_viewer_example
description: Demonstrates the eLivre Calibre-style reader.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  e_livre: ^3.2.0
  e_livre_viewer:
    path: ../
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# Keep the example on the same unpublished eLivre checkout as the library.
dependency_overrides:
  e_livre:
    path: ../../eLivre

flutter:
  uses-material-design: true
  assets:
    - assets/books/
