name: elivre_viewer_example
description: Demonstrates the eLivre Calibre-style reader.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  e_livre: ^3.2.0
  e_livre_viewer:
    path: ../
  flutter:
    sdk: flutter
  path_provider: ^2.1.6

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# Keep the example on the same unpublished eLivre checkout as the library.
dependency_overrides:
  e_livre:
    path: ../../eLivre
  # Dev-only: current AGP rejects the stable flutter_inappwebview
  # 6.1.5 (android 1.1.3 still references the removed
  # proguard-android.txt). 6.2.0-beta.3 ships the fix; drop this
  # override when 6.2 goes stable.
  flutter_inappwebview: 6.2.0-beta.3
  # Xcode 26 rejects the beta macOS provider's availability annotation.
  # Pin the upstream PR until it is merged and released.
  flutter_inappwebview_macos:
    git:
      url: https://github.com/wangqiang1588/flutter_inappwebview.git
      ref: fc33a449b9290b127a471808e22eb7b0edebad92
      path: flutter_inappwebview_macos

flutter:
  uses-material-design: true
  assets:
    - assets/books/
