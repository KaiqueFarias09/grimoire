project:
  name: e_livre_viewer
  kind: flutter-library
  description: Reusable Calibre-style ebook viewer for Flutter.
architecture:
  extends: steward/publishable-package
  version: 1.0.0
docs:
  primary: AGENTS.md
  agents:
    - AGENTS.md
targets:
  library:
    path: .
    kind: library
    runtime: flutter
    artifact: library
    publishable: true
    capabilities: [assets, platform-adapters, io]
  example:
    path: example
    kind: app
    runtime: flutter
    artifact: app
    publishable: false
    capabilities: [example, assets]
commands:
  library:
    - label: Flutter analyzer
      dir: .
      run: ["flutter", "analyze"]
      fast: true
    - label: Flutter tests
      dir: .
      run: ["flutter", "test"]
      fast: true
    - label: Flutter publish dry run
      dir: .
      run: ["flutter", "pub", "publish", "--dry-run"]
      fast: true
  example:
    - label: Example analyzer
      dir: example
      run: ["flutter", "analyze"]
      fast: true
    - label: Example tests
      dir: example
      run: ["flutter", "test"]
      fast: true
exceptions: []
