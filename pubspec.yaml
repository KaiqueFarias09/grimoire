name: e_livre_viewer
version: 0.2.0
description: >-
  Calibre-style ebook reader for Flutter built on eLivre. Renders
  EPUB, MOBI, AZW3, FB2/FBZ, TXT/TXZ, HTML/HTMLZ, DOCX, AZW4,
  CBZ/CBR/CB7/CBC, ODT and PDF with paginated layouts, themes, table
  of contents, search and text selection hooks.
repository: https://github.com/KaiqueFarias09/eLivreViewer
issue_tracker: https://github.com/KaiqueFarias09/eLivreViewer/issues

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

topics:
  - ebook
  - reader
  - epub
  - viewer

dependencies:
  e_livre: ^3.3.0
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  flutter_inappwebview: ^6.1.5
  shelf: ^1.4.0
  mime: ^2.0.0
  web: ^1.1.0
  xml: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Local monorepo validation uses the sibling E10 checkout; publication uses
# the hosted constraint above because dependency_overrides are not published.
dependency_overrides:
  e_livre:
    path: ../eLivre

flutter:
  assets:
    - assets/viewer/
