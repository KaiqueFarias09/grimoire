name: e_livre_viewer
version: 0.2.0
description: >-
  Calibre-style ebook reader for Flutter built on eLivre. Renders
  EPUB, MOBI, AZW3, FB2 and comics with paginated layouts, themes,
  table of contents, search and text selection hooks.
repository: https://github.com/KaiqueFarias09/eLivreViewer
issue_tracker: https://github.com/KaiqueFarias09/eLivreViewer/issues

environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.19.0"

topics:
  - ebook
  - reader
  - epub
  - viewer

dependencies:
  # Path dep during development; swap to ^3.2.0 after publishing eLivre.
  e_livre:
    path: ../eLivre
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  flutter_inappwebview: ^6.1.5
  shelf: ^1.4.0
  mime: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  assets:
    - assets/viewer/
