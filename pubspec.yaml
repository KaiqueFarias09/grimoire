name: grimoire
version: 1.0.0
description: >-
  Calibre-style ebook reader for Flutter built on Unseal. Renders
  EPUB, MOBI, AZW3, FB2/FBZ, TXT/TXZ, HTML/HTMLZ, DOCX, AZW4,
  CBZ/CBR/CB7/CBC, ODT and PDF with paginated layouts, themes, table
  of contents, search and text selection hooks.
repository: https://github.com/KaiqueFarias09/grimoire
issue_tracker: https://github.com/KaiqueFarias09/grimoire/issues

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

topics:
  - ebook
  - reader
  - epub
  - viewer

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  mime: ^2.0.0
  shelf: ^1.4.0
  unseal: ^1.3.0
  web: ^1.1.0
  webview_flutter: ^4.10.0

dev_dependencies:
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  webview_flutter_platform_interface: ^2.15.1

flutter:
  assets:
    - assets/viewer/
